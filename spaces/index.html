<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS insets the page from the notch and
         home-indicator areas and paints the gap with the body background, so the
         editor visibly stops short of the screen edges. The app fills the screen
         and positions its own chrome; it never needs the browser to pad it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <meta name="generator" content="webdeck-spaces" />
    <title>webdeck-spaces</title>
    <!-- NOTICE
      webdeck-spaces — MIT licensed. https://webdeck.page
      This file is the document, the viewer and the editor. The runtime is
      open source; the document itself is the JSON block below.
    -->
    <script type="application/webdeck+json" id="webdeck-doc"></script>
  </head>
  <body>
    <div id="webdeck-splash">
      <div class="sp-splash-mark">webdeck<span>/</span>spaces</div>
    </div>
    <style>
      #webdeck-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
        transition: opacity 0.45s ease;
        font: 600 20px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #1e2a3a;
      }
      #webdeck-splash.done { opacity: 0; pointer-events: none; }
      .sp-splash-mark span { color: #ff9e8a; }
      @media (prefers-reduced-motion: reduce) {
        #webdeck-splash { transition: none; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
